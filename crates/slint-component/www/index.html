<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPUI Kit — Slint</title>
    <script>
      (() => {
        try {
          const embedded = window.parent !== window;
          const root = embedded ? window.parent.document.documentElement : null;
          const stored = localStorage.getItem('theme');
          const dark = root
            ? root.classList.contains('dark')
            : stored === 'dark' ||
              (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (root) {
            const style = window.parent.getComputedStyle(root);
            const background = style.getPropertyValue('--background').trim();
            const foreground = style.getPropertyValue('--foreground').trim();
            if (background) document.documentElement.style.background = background;
            if (foreground) document.documentElement.style.color = foreground;
          }
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();

      // The first click focuses the canvas. The browser would otherwise scroll
      // the docs page to reveal it; later clicks do not, because it stays focused.
      const focusWithoutScroll = HTMLElement.prototype.focus;
      HTMLElement.prototype.focus = function (options) {
        const settings =
          options && typeof options === 'object'
            ? { ...options, preventScroll: true }
            : { preventScroll: true };
        focusWithoutScroll.call(this, settings);
      };
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0a0a0a;
      }
      canvas {
        display: block;
        /* Inline sizes from the window constraints lose to this. max-width
           in particular clamps the used width below the iframe. */
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 13px system-ui, sans-serif;
        color: #737373;
      }
      html[data-theme='dark'] #loading {
        color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="loading">Loading…</div>
    <script type="module">
      // Served as both `/slint-gallery` and `/slint-gallery/`.
      const folder = location.pathname.replace(/\/?$/, '/');
      const { default: init } = await import(`${folder}slint_component.js`);

      // winit starts its browser event loop by throwing this exception.
      await init().catch((error) => {
        if (!String(error?.message).startsWith('Using exceptions for control flow')) {
          throw error;
        }
      });
      document.getElementById('loading')?.remove();
      // The first Slint frame can keep the 800px preferred width. A resize
      // after layout makes it match the iframe, including the right padding.
      const fit = () => window.dispatchEvent(new Event('resize'));
      requestAnimationFrame(() => {
        fit();
        requestAnimationFrame(fit);
      });
    </script>
  </body>
</html>
