[package]
name = "slint-component"
description = "Hand-written Slint versions of the GPUI Component catalog, and the gallery the website embeds."
version = "0.6.4"
license = "Apache-2.0"
publish = false
edition = "2024"

# Not a member of the GPUI Kit workspace: Slint keeps its own lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "slint-gallery"
path = "src/main.rs"

[dependencies]
slint = "1.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = [
    "Location",
    "MediaQueryList",
    "Storage",
    "StorageEvent",
    "Window",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
